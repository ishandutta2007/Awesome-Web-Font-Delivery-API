<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0c1222"/>
      <stop offset="100%" stop-color="#111936"/>
    </linearGradient>

    <radialGradient id="glowTopLeft" cx="20%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowBottomRight" cx="80%" cy="85%" r="65%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="pillGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="pillGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="pillGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#db2777" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.08"/>
      <circle cx="40" cy="40" r="1" fill="#818cf8" fill-opacity="0.2"/>
    </pattern>

    <!-- Text Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0284c7" flood-opacity="0.15"/>
    </filter>

    <style>
      @keyframes floatY1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      @keyframes floatY2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(12px); }
      }
      @keyframes floatY3 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(1deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 0.95; }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -100; }
      }
      .anim-float1 { animation: floatY1 6s ease-in-out infinite; }
      .anim-float2 { animation: floatY2 7s ease-in-out infinite; }
      .anim-float3 { animation: floatY3 8s ease-in-out infinite; }
      .anim-pulse { animation: pulseGlow 4s ease-in-out infinite; }
      .anim-dash { stroke-dasharray: 8 6; animation: dashMove 12s linear infinite; }
    </style>
  </defs>

  <!-- 1. Background Layer -->
  <rect width="1200" height="420" rx="20" fill="url(#bgGradient)"/>
  <rect width="1200" height="420" rx="20" fill="url(#glowTopLeft)"/>
  <rect width="1200" height="420" rx="20" fill="url(#glowBottomRight)"/>
  <rect width="1200" height="420" rx="20" fill="url(#grid)"/>

  <!-- Border Frame -->
  <rect x="1.5" y="1.5" width="1197" height="417" rx="19" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- 2. Decorative Background Ambient Waves (Behind Text) -->
  <g class="anim-pulse" opacity="0.4">
    <path d="M 0 320 Q 300 280, 600 330 T 1200 300 L 1200 420 L 0 420 Z" fill="#0284c7" fill-opacity="0.08"/>
    <path d="M 0 345 Q 350 310, 700 360 T 1200 330 L 1200 420 L 0 420 Z" fill="#6366f1" fill-opacity="0.06"/>
  </g>

  <!-- Animated connecting data line -->
  <path d="M 100 80 Q 400 30, 700 85 T 1100 50" fill="none" stroke="#38bdf8" stroke-width="1.5" class="anim-dash" stroke-opacity="0.3"/>
  <path d="M 120 370 Q 500 320, 850 380 T 1120 350" fill="none" stroke="#a855f7" stroke-width="1.5" class="anim-dash" stroke-opacity="0.25"/>

  <!-- 3. Animated Peripheral Floating Pills (Positioned safely away from center title/subtitle) -->
  <!-- Top Left Pill -->
  <g class="anim-float1" transform="translate(60, 48)">
    <rect width="190" height="36" rx="18" fill="url(#pillGrad1)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="20" cy="18" r="5" fill="#38bdf8"/>
    <text x="35" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#bae6fd" letter-spacing="0.5">⚡ WOFF2 SUBSETTING</text>
  </g>

  <!-- Top Right Pill -->
  <g class="anim-float2" transform="translate(930, 48)">
    <rect width="210" height="36" rx="18" fill="url(#pillGrad3)" stroke="#34d399" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="20" cy="18" r="5" fill="#34d399"/>
    <text x="35" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#a7f3d0" letter-spacing="0.5">🔒 GDPR COMPLIANT</text>
  </g>

  <!-- Bottom Left Pill -->
  <g class="anim-float2" transform="translate(70, 336)">
    <rect width="220" height="36" rx="18" fill="url(#pillGrad2)" stroke="#818cf8" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="20" cy="18" r="5" fill="#818cf8"/>
    <text x="35" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#c7d2fe" letter-spacing="0.5">📦 NPM BUILD EMBEDDING</text>
  </g>

  <!-- Bottom Right Pill -->
  <g class="anim-float3" transform="translate(910, 336)">
    <rect width="220" height="36" rx="18" fill="url(#pillGrad4)" stroke="#f472b6" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="20" cy="18" r="5" fill="#f472b6"/>
    <text x="35" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#fbcfe8" letter-spacing="0.5">🌐 ANYCAST EDGE CDN</text>
  </g>

  <!-- 4. Foreground Content (Title, Badges & Subtitle - Guaranteed in Foreground & Completely Unobscured) -->
  <g id="foreground-layer" filter="url(#shadow)">
    <!-- Header Badge -->
    <g transform="translate(480, 75)">
      <rect width="240" height="30" rx="15" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1"/>
      <circle cx="16" cy="15" r="4" fill="#38bdf8"/>
      <text x="30" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="1.5">OPEN-SOURCE ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, Helvetica, sans-serif" font-size="44" font-weight="900" fill="url(#titleGradient)" letter-spacing="-0.5">
      Awesome Web Font Delivery API
    </text>

    <!-- Subtitle (Line 1) -->
    <text x="600" y="215" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#f1f5f9" letter-spacing="0.2">
      Curated Directory of Cloud Font Delivery APIs, Self-Hosted Servers &amp; Subsetting Frameworks
    </text>

    <!-- Subtitle (Line 2 - Tags) -->
    <text x="600" y="248" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#94a3b8" letter-spacing="0.5">
      Google Fonts Drop-In Replacements • GDPR Zero-Logging • CSS2 API • Build-Time Bundling
    </text>

    <!-- Visual Feature Badges Row -->
    <g transform="translate(370, 275)">
      <rect x="0" y="0" width="130" height="28" rx="8" fill="#1e293b" fill-opacity="0.7" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3"/>
      <text x="65" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#7dd3fc">⚡ High Speed</text>

      <rect x="145" y="0" width="160" height="28" rx="8" fill="#1e293b" fill-opacity="0.7" stroke="#818cf8" stroke-width="1" stroke-opacity="0.3"/>
      <text x="225" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#a5b4fc">🛡️ 100% Private</text>

      <rect x="320" y="0" width="140" height="28" rx="8" fill="#1e293b" fill-opacity="0.7" stroke="#34d399" stroke-width="1" stroke-opacity="0.3"/>
      <text x="390" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#6ee7b7">🚀 Self-Hosted</text>
    </g>
  </g>
</svg>
